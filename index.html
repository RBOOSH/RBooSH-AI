<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RBooSH AI - خفيف</title>
<link rel="manifest" href="manifest.json">
<script type="importmap">{"imports":{"@mlc-ai/web-llm":"https://esm.run/@mlc-ai/web-llm"}}</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f0f;color:#fff;font-family:system-ui;height:100vh;display:flex;flex-direction:column}
header{background:#1a1a1a;padding:12px 16px;border-bottom:2px solid #ff6a00;display:flex;justify-content:space-between}
#status{background:#ff6a00;color:#000;padding:8px;text-align:center;font-weight:bold}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:12px 14px;border-radius:16px;line-height:1.6}
.user{background:#ff6a00;color:#000;align-self:flex-end}
.ai{background:#1e1e1e;align-self:flex-start;white-space:pre-wrap}
#bar{background:#1a1a1a;padding:10px;display:flex;gap:8px}
#bar input{flex:1;background:#2a2a2a;border:none;color:#fff;padding:12px;border-radius:20px;outline:none}
#bar button{background:#ff6a00;border:none;width:42px;height:42px;border-radius:50%;cursor:pointer}
</style>
</head>
<body>
<header><b>🇸🇾 RBooSH خفيف</b><select id="dialect" style="background:#2a2a2a;color:#fff;border:none;padding:6px;border-radius:8px"><option>حسكاوي</option><option>شامي</option><option>كردي كرمانجي</option></select></header>
<div id="status">⏳ جاري تحميل 200MB فقط...</div>
<div id="chat"><div class="msg ai">هلا بالنسخة الخفيفة 🔥 200MB بس!</div></div>
<div id="bar"><input id="text" placeholder="استنى التحميل..." disabled><button onclick="send()" id="btn" disabled>➤</button></div>
<script type="module">
import * as webllm from "@mlc-ai/web-llm";
let engine;
function add(t,c){const d=document.createElement('div');d.className='msg '+c;d.textContent=t;const ch=document.getElementById('chat');ch.appendChild(d);ch.scrollTop=99999;return d}
async function init(){
 engine=await webllm.CreateMLCEngine("SmolLM2-360M-Instruct-q0f32-MLC",{
  initProgressCallback:(p)=>{document.getElementById('status').textContent=p.text}
 });
 document.getElementById('status').textContent="✅ جاهز! احكي هلا - يشتغل بدون نت";
 document.getElementById('text').disabled=false; document.getElementById('btn').disabled=false;
 document.getElementById('text').placeholder="اكتب هون...";
}
init();
window.send=async function(){
 const i=document.getElementById('text'); const txt=i.value.trim(); if(!txt)return; add(txt,'user'); i.value='';
 const loading=add('⏳...','ai');
 const dialect=document.getElementById('dialect').value;
 try{
  const r=await engine.chat.completions.create({
   messages:[{role:"system",content:`You are RBooSH AI, Syrian assistant from Hasakah. Answer ONLY in ${dialect} dialect, funny and short.`},{role:"user",content:txt}],temperature:0.7
  });
  loading.textContent=r.choices[0].message.content;
 }catch(e){loading.textContent="عيد المحاولة"}
}
document.getElementById('text').addEventListener('keypress',e=>{if(e.key==='Enter')window.send()});
</script>
</body>
</html>
